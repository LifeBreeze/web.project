<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>협력기업 — (주)펜테크 | 리디자인 시안</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css?v=20261121-142">
</head>
<body data-page="partner">
<main>
  <section class="page-head slim" style="--banner:url('https://www.pentech.kr/images/partner/s01_bg.webp')">
    <div class="wrap"><div>
      <nav class="crumb" aria-label="현재 위치"><a href="index.html">홈</a><span>협력기업</span></nav>
      <h1 class="rv-h"><small>PARTNER</small>함께 성장해온 펜테크의 협력 파트너들</h1>
      <p class="lead rv-h lead-2l"><span class="ln">전국의 협약사를 지역으로 찾아 보세요.</span><span class="ln">협약을 맺고 싶은 업체는 협약 문의를 남겨 주세요.</span></p>
    </div>
    <a class="btn btn-light head-inquire" href="contact.html?kind=협약#inquiry">협약 문의하기 <span class="arr">→</span></a></div>
  </section>

  <section class="sec tight" id="list">
    <div class="wrap">
      <div class="sec-head">
        <div><span class="eyebrow">협약사 리스트</span><h2 class="h2">전국 <span id="pCount">89</span>개 협약사</h2></div>
      </div>
      <div class="faq-tools partner-tools">
        <div class="filters" id="pRegion" style="margin:0" aria-label="지역으로 거르기"></div>
        <label class="search"><span class="sr">협약사 검색</span>
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="pSearch" type="search" placeholder="업체명 · 주소 검색">
        </label>
      </div>
      <div class="ptable" role="table" aria-label="협약사 리스트">
        <div class="prow phead" role="row"><span role="columnheader">NO</span><span role="columnheader">지역</span><span role="columnheader">협약사명</span><span role="columnheader">전화번호</span><span role="columnheader">주소</span></div>
        <div id="pBody"></div>
      </div>
      <nav class="pager" id="pPager" aria-label="쪽 번호"></nav>
      <p class="faq-empty" id="pEmpty" hidden>찾는 협약사가 없나요? <a class="link-arrow" href="contact.html?kind=협약#inquiry">협약 문의하기 →</a></p>
    </div>
  </section>

  <section class="cta">
    <div class="wrap">
      <div>
        <h2>펜테크와 함께<br>일하고 싶으신가요?</h2>
        <p>협약 문의를 남겨 주시면 담당자가 연락드립니다.</p>
      </div>
      <div class="btns">
        <a class="btn btn-light" href="contact.html?kind=협약#inquiry">협약 문의하기 <span class="arr">→</span></a>
        <a class="btn btn-line" href="tel:1599-7041">1599-7041</a>
      </div>
    </div>
  </section>
</main>

<script src="js/data.js?v=20261121-142"></script>
<script src="js/common.js?v=20261121-142"></script>
<script src="js/pages.js?v=20261121-142"></script>
